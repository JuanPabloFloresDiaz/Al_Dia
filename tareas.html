<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tareas · Al Día</title>
    <meta
      name="description"
      content="Todas tus tareas académicas, ordenadas por fecha de entrega."
    />
    <meta name="robots" content="noindex, follow" />
    <link rel="canonical" href="https://aldia.jupadidev.top/tareas.html" />
    <meta name="theme-color" content="#2b44d9" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Al Día" />
    <meta property="og:locale" content="es_SV" />
    <meta property="og:title" content="Tareas · Al Día" />
    <meta property="og:description" content="Todas tus tareas académicas, ordenadas por fecha de entrega." />
    <meta property="og:url" content="https://aldia.jupadidev.top/tareas.html" />
    <meta property="og:image" content="https://aldia.jupadidev.top/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Al Día: gestor de tareas académicas" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tareas · Al Día" />
    <meta name="twitter:description" content="Todas tus tareas académicas, ordenadas por fecha de entrega." />
    <meta name="twitter:image" content="https://aldia.jupadidev.top/og-image.png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      #cargador-pagina {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #f2f4f6;
        color: #1f2937;
        transition:
          opacity 0.25s ease,
          visibility 0.25s ease;
      }
      #cargador-pagina .spinner {
        width: 3rem;
        height: 3rem;
        border: 4px solid #d8dee4;
        border-top-color: #0f766e;
        border-radius: 50%;
        animation: carga-giro 0.8s linear infinite;
      }
      #cargador-pagina p {
        margin-top: 0.75rem;
        font:
          700 1rem system-ui,
          sans-serif;
      }
      #cargador-pagina.saliendo {
        opacity: 0;
        visibility: hidden;
      }
      @keyframes carga-giro {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #cargador-pagina .spinner {
          animation-duration: 1.8s;
        }
      }
    </style>
  </head>
  <body>
    <div id="cargador-pagina" role="status" aria-label="Cargando Al Día">
      <div>
        <div class="spinner"></div>
        <p>Al Día</p>
      </div>
    </div>
    <div data-componente="navbar" data-activo="tareas"></div>

    <main id="contenido" class="mx-auto max-w-5xl px-4 pt-10">
      <div class="flex flex-wrap items-end justify-between gap-4">
        <div>
          <h1>Tareas</h1>
          <p id="tareas-contador" class="mt-2 text-suave" aria-live="polite">
            Cargando…
          </p>
        </div>
        <a href="/tarea-nueva.html" class="btn">Nueva tarea</a>
      </div>

      <!-- Filtros: se conectan en tareas.controller.js (pendiente del equipo). -->
      <form
        id="form-filtros"
        class="mt-8 grid gap-4 sm:grid-cols-2 lg:grid-cols-4"
        role="search"
        aria-label="Filtrar tareas"
      >
        <div class="campo">
          <label for="filtro-texto">Buscar</label>
          <input
            class="entrada"
            id="filtro-texto"
            type="search"
            placeholder="Parte del nombre"
            autocomplete="off"
          />
        </div>
        <div class="campo">
          <label for="filtro-materia">Materia</label>
          <select class="entrada" id="filtro-materia">
            <option value="">Todas</option>
          </select>
        </div>
        <div class="campo">
          <label for="filtro-tipo">Tipo</label>
          <select class="entrada" id="filtro-tipo">
            <option value="">Todos</option>
            <option value="lectura">Lectura</option>
            <option value="proyecto">Proyecto</option>
            <option value="examen">Examen</option>
            <option value="otro">Otro</option>
          </select>
        </div>
        <div class="campo">
          <label for="filtro-estado">Estado</label>
          <select class="entrada" id="filtro-estado">
            <option value="">Todas</option>
            <option value="pendientes">Pendientes</option>
            <option value="atrasadas">Atrasadas</option>
            <option value="terminadas">Terminadas</option>
          </select>
        </div>
      </form>

      <div id="lista-tareas" class="lista-filas mt-8"></div>
      <div id="vacio-tareas" class="vacio mt-8" hidden>
        <p class="mx-auto">Ninguna tarea coincide con lo que buscas.</p>
      </div>
    </main>

    <div data-componente="pie"></div>
    <script type="module" src="/src/controllers/tareas.controller.js"></script>
  </body>
</html>
