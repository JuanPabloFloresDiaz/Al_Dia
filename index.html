<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Al Día · Gestor de tareas académicas</title>
    <meta
      name="description"
      content="Gestor de tareas académicas: ve lo que entregas esta semana, divide trabajos grandes en pasos con fechas y recibe avisos del avance. Sin cuenta."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://aldia.jupadidev.top/" />
    <meta name="theme-color" content="#2b44d9" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Al Día" />
    <meta property="og:locale" content="es_SV" />
    <meta property="og:title" content="Al Día · Gestor de tareas académicas" />
    <meta property="og:description" content="Gestor de tareas académicas: ve lo que entregas esta semana, divide trabajos grandes en pasos con fechas y recibe avisos del avance. Sin cuenta." />
    <meta property="og:url" content="https://aldia.jupadidev.top/" />
    <meta property="og:image" content="https://aldia.jupadidev.top/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Al Día: gestor de tareas académicas" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Al Día · Gestor de tareas académicas" />
    <meta name="twitter:description" content="Gestor de tareas académicas: ve lo que entregas esta semana, divide trabajos grandes en pasos con fechas y recibe avisos del avance. Sin cuenta." />
    <meta name="twitter:image" content="https://aldia.jupadidev.top/og-image.png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      #cargador-pagina {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #f2f4f6;
        color: #1f2937;
        transition:
          opacity 0.25s ease,
          visibility 0.25s ease;
      }
      #cargador-pagina .spinner {
        width: 3rem;
        height: 3rem;
        border: 4px solid #d8dee4;
        border-top-color: #0f766e;
        border-radius: 50%;
        animation: carga-giro 0.8s linear infinite;
      }
      #cargador-pagina p {
        margin-top: 0.75rem;
        font:
          700 1rem system-ui,
          sans-serif;
      }
      #cargador-pagina.saliendo {
        opacity: 0;
        visibility: hidden;
      }
      @keyframes carga-giro {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #cargador-pagina .spinner {
          animation-duration: 1.8s;
        }
      }
    </style>
  </head>
  <body>
    <div id="cargador-pagina" role="status" aria-label="Cargando Al Día">
      <div>
        <div class="spinner"></div>
        <p>Al Día</p>
      </div>
    </div>
    <div data-componente="navbar" data-activo="hoy"></div>

    <main id="contenido" class="mx-auto max-w-5xl px-4 pt-10">
      <!-- Cabecera: la fecha de hoy es lo primero que se ve (la rellena hoy.controller.js). -->
      <section aria-labelledby="hoy-titulo">
        <h1 id="hoy-titulo">Hoy</h1>
        <p id="hoy-resumen" class="mt-3 text-xl text-suave" aria-live="polite">
          Cargando tus tareas…
        </p>
        <div
          id="search-hoy"
          class="mt-6 w-full"
          role="search"
          aria-label="Buscar tareas"
        ></div>
      </section>

      <!-- La semana, de lunes a domingo, con las entregas de cada día. -->
      <section class="mt-12" aria-labelledby="semana-titulo">
        <h2 id="semana-titulo" class="mb-4">Esta semana</h2>
        <div
          id="semana"
          class="entrada-escalonada flex gap-3 overflow-x-auto pb-2 md:grid md:grid-cols-7 md:overflow-visible"
        ></div>
      </section>

      <!-- Atrasadas: solo se muestra si hay alguna. -->
      <section
        id="seccion-atrasadas"
        class="mt-12"
        aria-labelledby="atrasadas-titulo"
        hidden
      >
        <h2 id="atrasadas-titulo" class="mb-4">Atrasadas</h2>
        <div id="lista-atrasadas" class="lista-filas"></div>
      </section>

      <section class="mt-12" aria-labelledby="proximas-titulo">
        <div class="mb-4 flex items-end justify-between gap-4">
          <h2 id="proximas-titulo">Lo que viene</h2>
          <a href="/tareas.html">Ver todas las tareas</a>
        </div>
        <div id="lista-proximas" class="lista-filas"></div>
        <div id="vacio-proximas" class="vacio" hidden>
          <p class="mx-auto">
            No tienes tareas pendientes. Cuando recibas una entrega nueva,
            regístrala aquí.
          </p>
          <a href="/tarea-nueva.html" class="btn mt-4">Registrar una tarea</a>
        </div>
      </section>
    </main>

    <div data-componente="pie"></div>
    <script type="module" src="/src/controllers/hoy.controller.js"></script>
  </body>
</html>
