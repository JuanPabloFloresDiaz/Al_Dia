# Al Día para Dokploy (servicio tipo COMPOSE, Compose Path: ./docker-compose.dokploy.yml).
#
# Se llama "docker-compose.dokploy.yml" a propósito: `docker compose up` normal (local) sigue usando
# docker-compose.yml, que publica el puerto 8085 y trae el servicio de desarrollo.
#
# Diferencias con docker-compose.yml:
#   - NO publica ningún puerto del servidor (sin `ports:`): el tráfico llega por Traefik, el proxy de Dokploy.
#     En la pestaña "Domains" de Dokploy: servicio `web`, puerto 80, HTTPS con Let's Encrypt.
#   - Sin `container_name` (Dokploy pone el suyo y así no choca con otro despliegue).
#   - Sin el servicio `desarrollo` ni volúmenes: aquí solo se publica el sitio compilado.
#   - `web` se une a `dokploy-network` para que Traefik lo alcance.
#
# No necesita variables de entorno: el sitio es estático y los datos de cada persona viven en su navegador (IndexedDB).
services:
  web:
    build:
      context: .
      target: produccion
    restart: unless-stopped
    mem_limit: 128m
    pids_limit: 100
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    networks: [dokploy-network]

networks:
  dokploy-network:
    external: true
